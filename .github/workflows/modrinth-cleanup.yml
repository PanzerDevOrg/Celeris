name: Delete Modrinth versions

# One-off maintenance: deletes Modrinth versions whose version number matches a
# regex (e.g. the 0.1.0+<mc> uploads that were replaced). Dry run by default.
on:
  workflow_dispatch:
    inputs:
      pattern:
        description: "Regex matched against version_number"
        required: true
      dry_run:
        description: "Only list what would be deleted"
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete matching versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT: ${{ vars.MODRINTH_ID }}
          PATTERN: ${{ inputs.pattern }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          UA="PanzerDevOrg/Celeris CI"
          curl -sSf -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: $UA" \
            "https://api.modrinth.com/v2/project/$PROJECT/version" > versions.json
          jq -r --arg p "$PATTERN" '.[] | select(.version_number | test($p)) | "\(.id) \(.version_number)"' versions.json > matches.txt
          echo "All versions:"; jq -r '.[].version_number' versions.json
          echo "Matching '$PATTERN':"; cat matches.txt
          [ "$DRY_RUN" = "true" ] && { echo "Dry run: nothing deleted."; exit 0; }
          while read -r id number; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: $MODRINTH_TOKEN" \
              -H "User-Agent: $UA" "https://api.modrinth.com/v2/version/$id")
            echo "DELETE $number ($id) -> HTTP $code"
            [ "$code" = 204 ] || exit 1
          done < matches.txt
