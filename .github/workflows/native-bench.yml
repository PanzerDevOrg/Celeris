# Step time of several builds of the physics kernel, side by side, on the CI runners (x86-64
# and ARM, so the AVX2, AVX-512 and NEON paths each get measured where the CPU has them).
# Manual: every ref is built, and native/test/cp_bench steps the same scene through all of
# them, alternating block by block. Read the ratio against the first build, with its
# quartiles; the last build is listed twice and the repeat shows how far two readings of the
# same code differ in that run. Absolute times on a shared runner are not comparable between
# runs. Every ref must share the column layout of cp_step with this one (true since the
# kernel's first release). cp_bench itself is taken from the ref the workflow runs on.
# Not managed by bichal-build-logic: this file belongs to Celeris.
name: Native bench

on:
  workflow_dispatch:
    inputs:
      refs:
        description: Builds to compare, space-separated branches, tags or commits (the first is the reference)
        default: ee57408c3a5b0b41f470ab0be4a877a7bca73d2a main  # c2deb03^ (no input checks), then main
      unit:
        description: Bodies per batch (1024 or 16)
        default: "1024"
      ticks:
        description: Measured ticks
        default: "400"

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      REFS: ${{ inputs.refs }}
      UNIT: ${{ inputs.unit }}
      TICKS: ${{ inputs.ticks }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build every ref
        run: |
          cmake -S native -B build-bench -DCMAKE_BUILD_TYPE=Release
          cmake --build build-bench -j "$(nproc)" --target cp_bench
          libs=()
          i=0
          for ref in $REFS; do
            git worktree add --detach "../w$i" "$ref" >/dev/null
            cmake -S "../w$i/native" -B "build-$i" -DCMAKE_BUILD_TYPE=Release -DCP_BUILD_TESTS=OFF >/dev/null
            cmake --build "build-$i" -j "$(nproc)"
            libs+=("build-$i/libceleris_physics.so")
            echo "build $i = $ref ($(git rev-parse --short "$ref"))"
            i=$((i + 1))
          done
          printf '%s\n' "${libs[@]}" "${libs[-1]}" > libs.txt
      - name: Step time
        run: |
          grep -m1 'model name\|Model name' /proc/cpuinfo || true
          mapfile -t libs < libs.txt
          for isa in generic avx2 avx512 neon; do
            ./build-bench/cp_bench ab "$isa" "${UNIT:-1024}" "${TICKS:-400}" "${libs[@]}" || echo "$isa: not available on this runner"
          done
