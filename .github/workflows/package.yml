name: Build and Package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Release dry run: build, check and preview only (on a tag ref, untick to publish)"
        type: boolean
        default: true
      targets:
        description: "Release targets"
        type: string
        default: github,modrinth,curseforge
  push:
    branches: [master]
    tags: ["v*"]
    # Docs-only commits don't rebuild anything (path filters never apply to tag
    # pushes, so releases always run). README changes sync the descriptions in
    # descriptions.yml.
    paths-ignore: ["docs/**", "**.md", "LICENSE*", ".gitignore"]
  pull_request:
    paths-ignore: ["docs/**", "**.md", "LICENSE*", ".gitignore"]

permissions:
  contents: write

# settings.gradle.kts reads ../panzer-build-logic/common.stonecutter.properties.toml
# and includeBuild()s it, so both repos are checked out side by side under the
# workspace (checkout cannot write outside $GITHUB_WORKSPACE).
defaults:
  run:
    working-directory: Celeris

jobs:
  physics-natives:
    # Builds and self-tests native/ (celeris_physics) on every platform it ships
    # for; the build job bundles the results. Linux x86_64 is also committed
    # under natives/ so local builds without CMake still get it.
    name: celeris_physics ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: Celeris
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64,   runner: ubuntu-latest,    file: libceleris_physics.so }
          - { platform: linux-aarch64,  runner: ubuntu-24.04-arm, file: libceleris_physics.so }
          - { platform: windows-x86_64, runner: windows-latest,   file: celeris_physics.dll }
          - { platform: macos-x86_64,   runner: macos-13,         file: libceleris_physics.dylib }
          - { platform: macos-aarch64,  runner: macos-14,         file: libceleris_physics.dylib }
    steps:
      - uses: actions/checkout@v5
        with:
          path: Celeris

      # Builds every ISA variant the platform has and runs cp_selftest, which
      # checks each one the runner's CPU supports bit for bit against the
      # generic path.
      - name: CMake build + self-test
        shell: bash
        run: |
          cmake -S native -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --config Release --parallel
          ctest --test-dir build-native -C Release --output-on-failure
          mkdir -p out
          find build-native -name '${{ matrix.file }}' -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v5
        with:
          name: physics-${{ matrix.platform }}
          path: Celeris/out/${{ matrix.file }}
          if-no-files-found: error

  build:
    name: Build all versions + package JAR with natives
    needs: physics-natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: Celeris

      - uses: actions/checkout@v5
        with:
          repository: PanzerDevOrg/PanzerBuildLogic
          path: panzer-build-logic

      # 21 for Minecraft 1.21.x, 25 for 26.1 (the last entry becomes the default JDK).
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: actions/download-artifact@v5
        with:
          pattern: physics-*
          path: physics-natives

      # natives/<os>/<arch>/ is where collectNatives looks for every library.
      - name: Stage celeris_physics binaries
        run: |
          set -euo pipefail
          for dir in ../physics-natives/physics-*; do
            plat=${dir##*/physics-}
            mkdir -p "natives/${plat%%-*}/${plat#*-}"
            cp "$dir"/* "natives/${plat%%-*}/${plat#*-}/"
          done
          find natives -name '*celeris_physics*'

      - name: Verify natives are present for all supported platforms
        run: |
          set -euo pipefail
          for path in \
            natives/windows/x86_64/zstd.dll natives/windows/aarch64/zstd.dll \
            natives/linux/x86_64/libzstd.so natives/linux/aarch64/libzstd.so \
            natives/linux/ppc64le/libzstd.so natives/linux/riscv64/libzstd.so \
            natives/macos/x86_64/libzstd.dylib natives/macos/aarch64/libzstd.dylib \
            natives/linux/x86_64/libceleris_physics.so natives/linux/aarch64/libceleris_physics.so \
            natives/windows/x86_64/celeris_physics.dll \
            natives/macos/x86_64/libceleris_physics.dylib natives/macos/aarch64/libceleris_physics.dylib; do
            [ -f "$path" ] || { echo "::error::Missing native $path"; exit 1; }
          done

      - name: Build and test every Minecraft version
        run: |
          chmod +x ./gradlew
          ./gradlew build buildAndCollect -Pceleris.fatJar=true --no-watch-fs --stacktrace

      # buildAndCollect writes, per Minecraft version: the universal jar, the
      # per-system jars ([publish] platforms) and the sources jar.
      - name: Verify jars and their natives
        run: |
          set -euo pipefail
          ALL="windows-x86_64 windows-aarch64 linux-x86_64 linux-aarch64 linux-ppc64le linux-riscv64 macos-x86_64 macos-aarch64"
          natives() { unzip -Z1 "$1" | sed -n 's#^natives/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' '; }
          for JAR in $(find build/libs -mindepth 2 -maxdepth 2 -name "*.jar" | grep -Ev -- '-(sources|dev|windows|linux|macos|java)\.jar$'); do
            BASE=${JAR%.jar}
            for plat in $ALL; do
              unzip -Z1 "$JAR" | grep -q "^natives/$plat/" || { echo "::error::$JAR lacks natives for $plat"; exit 1; }
            done
            for os in windows linux macos; do
              [ -f "$BASE-$os.jar" ] || { echo "::error::missing $BASE-$os.jar"; exit 1; }
              OTHER=$(natives "$BASE-$os.jar" | tr ' ' '\n' | grep -v "^$os-" | grep -v '^$' || true)
              [ -z "$OTHER" ] || { echo "::error::$BASE-$os.jar contains foreign natives: $OTHER"; exit 1; }
              [ -n "$(natives "$BASE-$os.jar")" ] || { echo "::error::$BASE-$os.jar has no natives"; exit 1; }
            done
            [ -z "$(natives "$BASE-java.jar")" ] || { echo "::error::$BASE-java.jar contains natives"; exit 1; }
            [ -f "$BASE-sources.jar" ] || { echo "::error::missing $BASE-sources.jar"; exit 1; }
            echo "ok: $(basename "$JAR") (+ windows/linux/macos/java/sources)"
          done

      - name: Upload jars
        uses: actions/upload-artifact@v5
        with:
          name: celeris-jars
          path: Celeris/build/libs/
          if-no-files-found: error

  publish:
    # Only on version tags (v0.1.0, ...). Consumers (Tessera) resolve
    # com.panzer.mods:celeris-<mc>:<version> from https://panzerdevorg.github.io/Celeris/maven
    if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: Celeris

      - uses: actions/checkout@v5
        with:
          repository: PanzerDevOrg/PanzerBuildLogic
          path: panzer-build-logic

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: actions/download-artifact@v5
        with:
          pattern: physics-*
          path: physics-natives

      - name: Stage celeris_physics binaries
        run: |
          set -euo pipefail
          for dir in ../physics-natives/physics-*; do
            plat=${dir##*/physics-}
            mkdir -p "natives/${plat%%-*}/${plat#*-}"
            cp "$dir"/* "natives/${plat%%-*}/${plat#*-}/"
          done

      # The published version comes from [mod] version in mod.stonecutter.properties.toml;
      # refuse to publish if the tag disagrees, so v0.2.0 can never ship 0.1.0 artifacts.
      - name: Check tag matches mod version
        run: |
          MOD_VERSION=$(sed -n '/^\[mod\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' mod.stonecutter.properties.toml)
          [ "v$MOD_VERSION" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME != mod version $MOD_VERSION"; exit 1; }

      - name: Publish every version to the staging Maven tree
        run: |
          chmod +x ./gradlew
          ./gradlew publishAllPublicationsToGitHubPagesRepository --no-watch-fs --stacktrace

      - name: Publish static Maven repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Celeris/build/publish-repo
          destination_dir: maven
          keep_files: true

  release:
    # GitHub release (universal + per-system + sources jars), Modrinth and
    # CurseForge, through panzer-build-logic's shared publisher. Every push is
    # a dry run that uploads a "release-preview" artifact (pages and files as
    # they would be published); only a v* tag publishes for real.
    # Secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN. Project ids: [publish] in the TOML.
    needs: [build, publish]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.publish.result != 'failure' }}
    uses: PanzerDevOrg/PanzerBuildLogic/.github/workflows/mod-release.yml@master
    with:
      jars-artifact: celeris-jars
      dry-run: ${{ !(startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)) }}
      targets: ${{ inputs.targets || 'github,modrinth,curseforge' }}
    secrets: inherit
    permissions:
      contents: write
