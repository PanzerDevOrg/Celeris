[jvm.modules.ffm]
enable_preview = true
enable_native_access = "ALL-UNNAMED"
add_to_runtime = true

[jvm.modules.vector]
add_modules = "jdk.incubator.vector"
# Preview is needed only by SimdSegmentLanes, which touches java.lang.foreign
# lanes on JDK 21. javac marks solely the classes that touch preview APIs,
# so SimdVectorBackend itself stays loadable without --enable-preview.
enable_preview = true
add_to_runtime = true

# Batch physics kernel (native/). panzer-build-logic registers
# buildNativeCelerisPhysics (CMake, host platform -> natives/<os>/<arch>/) and
# nativeHeadersCelerisPhysics (native/include, published as `native-headers`).
# -Ppanzer.native.build=true rebuilds it before packaging; otherwise the
# committed binaries are used. Platforms without a binary use the Java kernel.
[natives.celeris_physics]
cmake_dir = "native"
headers = "native/include"
platforms = ["linux-x86_64", "linux-aarch64", "windows-x86_64", "macos-x86_64", "macos-aarch64"]

[tools.oxipng]
enabled = false

[mod]
id = "celeris"
name = "Celeris"
group = "com.panzer.mods"
package = "com.panzer.mods.celeris"
version = "0.2.0"
license = "AGPLv3"
resources_license = "CC-BY-NC-SA-4.0"
authors = "Bichal"
description = "Celeris: off-heap memory management, lock-free concurrency, and native SIMD/compression engine for NeoForge."
side = "BOTH"
issues = "https://github.com/PanzerDevOrg/Celeris/issues"
banner = ""

# One build per binary-compatible group of Minecraft versions, each boot-tested
# on real NeoForge servers for every version listed in its game_versions:
#   1.21.1  -> 1.21 .. 1.21.6    (pre-1.21.7 payload registration API)
#   1.21.10 -> 1.21.7 .. 1.21.10 (new payload API, still ResourceLocation)
#   1.21.11 -> 1.21.11           (ResourceLocation renamed to Identifier)
#   26.1    -> 26.1 .. 26.3      (Java 25 build: final FFM API, native zstd)
# game_versions is what CI publishes to Modrinth/CurseForge and how the release
# name is built (e.g. 0.1.0-1.21(.0-.6)); minecraft_version_range must cover
# exactly the same versions.
[stonecutter]
versions = ["1.21.1", "1.21.10", "1.21.11", "26.1"]
vcs_version = "1.21.1"

[ring_buffer]
default_capacity_pow2 = 16
cache_line_bytes = 64

[network]
compression_threshold_bytes = 256
compression_algo = "zstd"

["1.21.1"]
minecraft_version = "1.21.1"
minecraft_version_range = "[1.21,1.21.7)"
neo_version = "21.1.248"
neo_version_range = "[21.0,21.7)"
parchment_mappings_version = "2024.11.17"
game_versions = ["1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6"]

["1.21.10"]
minecraft_version = "1.21.10"
minecraft_version_range = "[1.21.7,1.21.11)"
neo_version = "21.10.64"
neo_version_range = "[21.7,21.11)"
parchment_mappings_version = "2025.10.12"
game_versions = ["1.21.7", "1.21.8", "1.21.9", "1.21.10"]

["1.21.11"]
minecraft_version = "1.21.11"
minecraft_version_range = "[1.21.11,1.21.12)"
neo_version = "21.11.45"
neo_version_range = "[21.11,21.12)"
parchment_mappings_version = "2025.12.20"
game_versions = ["1.21.11"]

["26.1"]
minecraft_version = "26.1"
minecraft_version_range = "[26.1,26.4)"
neo_version = "26.1.0.19-beta"
neo_version_range = "[26.1,26.4)"
# parchment_mappings_version: no more versions available for ParchmentMC
game_versions = ["26.1", "26.1.1", "26.1.2", "26.2", "26.3"]
